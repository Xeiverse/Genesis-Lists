name: Android Release

# Builds the companion APK when a GitHub Release is published (e.g. v0.3.0)
# and attaches genesis-lists-<version>.apk to that release. Manual dispatch can
# backfill an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "Tag must look like v0.3.0 (got: $tag)" >&2; exit 1 ;;
          esac
          ver="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/**/gradle-wrapper.properties

      # v4 no longer installs the obsolete SDK `tools` package (removed by Google).
      # build-tools provides apksigner so we can sign unsigned outputs from older tags.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Optional release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; APK will be debug-signed for sideloading."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/genesis-lists-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/genesis-lists-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.tag.outputs.version }}" \
            --stacktrace
          echo "Release APK outputs:"
          ls -la app/build/outputs/apk/release/ || true

      # Checkout is the release tag, so Gradle signing from later commits is not
      # present (v0.3.0 emits app-release-unsigned.apk). Sign here so the
      # attached asset is always installable.
      - name: Sign and name APK for the release
        id: apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          src_dir="apps/android/app/build/outputs/apk/release"
          if [ -f "$src_dir/app-release.apk" ]; then
            src="$src_dir/app-release.apk"
          elif [ -f "$src_dir/app-release-unsigned.apk" ]; then
            src="$src_dir/app-release-unsigned.apk"
          else
            echo "Expected release APK missing under $src_dir" >&2
            ls -la "$src_dir" || true
            exit 1
          fi

          find_apksigner() {
            if command -v apksigner >/dev/null 2>&1; then
              command -v apksigner
              return
            fi
            local sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            local latest
            latest="$(ls -1d "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "${latest}" ]; then
              echo "$latest"
              return
            fi
            echo "apksigner not found under $sdk/build-tools" >&2
            exit 1
          }

          APKSIGNER="$(find_apksigner)"
          out="genesis-lists-${{ steps.tag.outputs.version }}.apk"

          if "$APKSIGNER" verify --min-sdk-version 26 "$src" >/dev/null 2>&1; then
            echo "Release APK is already signed: $src"
            cp "$src" "$out"
          else
            echo "Signing unsigned APK: $src"
            if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
              ks="$ANDROID_KEYSTORE_PATH"
              alias="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required when ANDROID_KEYSTORE_PATH is set}"
              storepass="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEYSTORE_PATH is set}"
              keypass="${ANDROID_KEY_PASSWORD:-$storepass}"
            else
              ks="${RUNNER_TEMP:-/tmp}/genesis-lists-sideload.jks"
              alias="androiddebugkey"
              storepass="android"
              keypass="android"
              keytool -genkeypair \
                -keystore "$ks" \
                -storetype JKS \
                -storepass "$storepass" \
                -alias "$alias" \
                -keypass "$keypass" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "No ANDROID_KEYSTORE_PATH; debug-signing for sideloading."
            fi
            "$APKSIGNER" sign \
              --ks "$ks" \
              --ks-key-alias "$alias" \
              --ks-pass "pass:${storepass}" \
              --key-pass "pass:${keypass}" \
              --min-sdk-version 26 \
              --out "$out" \
              "$src"
          fi

          "$APKSIGNER" verify --min-sdk-version 26 "$out"
          echo "path=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-lists-${{ steps.tag.outputs.version }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
