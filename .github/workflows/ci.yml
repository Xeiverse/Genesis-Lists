name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @genesis-lists/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @genesis-lists/web build
      - run: pnpm --filter @genesis-lists/server build
