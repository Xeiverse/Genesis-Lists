services:
  app:
    image: ghcr.io/xeiverse/genesis-lists:${GENESIS_LISTS_VERSION:-1.0.0}
    build: .
    # missing: use a local image if present; `docker compose pull` upgrades a published tag.
    # Before the tag exists on GHCR, start with `docker compose up -d --build`.
    pull_policy: missing
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      DATABASE_PATH: /data/app.db
      STATIC_DIR: /app/web
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      APP_VERSION: ${GENESIS_LISTS_VERSION:-1.0.0}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - genesis-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--experimental-sqlite",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  genesis-data:
