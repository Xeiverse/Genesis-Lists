openapi: 3.0.3
info:
  title: Genesis Lists API
  version: 0.2.0
  description: |
    REST API for Genesis Lists. Session cookie authentication with optional OIDC.
    Includes shared lists (members). Spec is the source of truth — see docs/04-api.md.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [Health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: "0.2.0"
                schemaVersion: 4
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthErrorResponse'
              example:
                status: error
                version: "0.2.0"

  /api/auth/registration:
    get:
      operationId: getRegistration
      summary: Whether new password accounts can be created
      description: >
        Returns open=false when registration is closed by ALLOW_REGISTRATION
        or when password login is disabled via OIDC_DISABLE_PASSWORD_LOGIN.
      tags: [Auth]
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatus'
              example:
                open: true

  /api/auth/config:
    get:
      operationId: getAuthConfig
      summary: Public auth configuration for the SPA
      tags: [Auth]
      responses:
        '200':
          description: Auth UI configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
              example:
                registrationOpen: true
                passwordLoginEnabled: true
                oidc:
                  enabled: false
                  buttonText: Sign in with OIDC
                  autoLaunch: false

  /api/auth/register:
    post:
      operationId: register
      summary: Register a new user and create a session
      description: >
        Returns 403 when registration is closed or password login is disabled.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCredentials'
            example:
              email: alice@example.com
              password: secretpass
              name: Alice
      responses:
        '201':
          description: Created and logged in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (genesis_session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/login:
    post:
      operationId: login
      summary: Log in and create a session
      description: Returns 403 when password login is disabled.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/auth/oidc/start:
    get:
      operationId: startOidc
      summary: Begin OIDC Authorization Code login
      description: >
        Redirects the browser to the IdP authorize URL. Returns 404 when OIDC is disabled.
      tags: [Auth]
      responses:
        '302':
          description: Redirect to the identity provider
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          description: OIDC misconfigured or discovery unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Complete OIDC login
      description: >
        Exchanges the authorization code, links or creates the local user, sets the
        session cookie, and redirects to `/`. On failure redirects to `/login?error=oidc`.
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to app home or login error
          headers:
            Location:
              schema:
                type: string
              description: `/` on success or `/login?error=oidc` on failure
            Set-Cookie:
              schema:
                type: string
              description: Session cookie on success

  /api/auth/logout:
    post:
      operationId: logout
      summary: Destroy the current session
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/me:
    get:
      operationId: getMe
      summary: Current authenticated user
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      operationId: updateMe
      summary: Update the current user's display name
      description: >
        Changes the name other users see in the share picker and on shared lists.
        Display names are not unique. The email address cannot be changed here.
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: Alice
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/change-password:
    post:
      operationId: changePassword
      summary: Change the current user's password
      description: |
        Updates the password hash. Other sessions for this user are deleted;
        the session that made this request stays signed in.
        Returns 403 when the user has no local password (OIDC-only account).
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/users:
    get:
      operationId: listUsers
      summary: List all users on the instance
      description: >
        Self-host directory for the share picker. Returns id and display name for every
        account. Signed-in users can see all display names on the instance.
        Email addresses are never returned for other users.
      tags: [Users]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDirectoryEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/lists:
    get:
      operationId: listLists
      summary: List lists owned by or shared with the current user
      description: >
        Each list includes itemCount, up to 8 previewItems (by position), isOwner, and ownerName.
      tags: [Lists]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lists]
                properties:
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/List'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      operationId: createList
      summary: Create a list
      tags: [Lists]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/lists/{id}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    patch:
      operationId: updateList
      summary: Rename a list
      description: Owner or member may rename. Users without access receive 404.
      tags: [Lists]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteList
      summary: Delete a list and its items
      description: Owner only. Members receive 403 FORBIDDEN. Users without access receive 404.
      tags: [Lists]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/lists/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: listMembers
      summary: List members of a list
      description: Owner only. Does not include the owner. Members receive 403; no access → 404.
      tags: [Members]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListMember'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      operationId: putMembers
      summary: Replace the member set for a list
      description: >
        Owner only. Body userIds is the complete desired member set (Immich-style save).
        Empty array clears all members. Rejects the owner id or unknown user ids (400).
        Members receive 403; no access → 404.
      tags: [Members]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMembersRequest'
      responses:
        '200':
          description: Updated member set
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/lists/{id}/members/me:
    parameters:
      - $ref: '#/components/parameters/ListId'
    delete:
      operationId: leaveList
      summary: Leave a shared list
      description: >
        Removes the current user from list_members. Members only.
        Owners receive 400. Non-members or users without access receive 404.
      tags: [Members]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Left the list
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/lists/{id}/items:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: listItems
      summary: List items in a list
      tags: [Items]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: createItem
      summary: Add an item to a list
      tags: [Items]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/lists/{id}/items/checked:
    parameters:
      - $ref: '#/components/parameters/ListId'
    delete:
      operationId: clearCheckedItems
      summary: Delete every ticked item on a list
      description: >
        Deletes items where checked is true. Unticked items are left in place.
        Idempotent: 204 when the list is accessible (owner or member) even if nothing is ticked.
        404 if the list is missing or not accessible (no existence leak).
      tags: [Items]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Ticked items deleted (or none were ticked)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    patch:
      operationId: updateItem
      summary: Update an item
      tags: [Items]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteItem
      summary: Delete an item
      tags: [Items]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: genesis_session

  parameters:
    ListId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status, version, schemaVersion]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "0.2.0"
        schemaVersion:
          type: integer
          minimum: 1
          example: 4

    HealthErrorResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [error]
        version:
          type: string

    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean

    AuthConfig:
      type: object
      required: [registrationOpen, passwordLoginEnabled, oidc]
      properties:
        registrationOpen:
          type: boolean
        passwordLoginEnabled:
          type: boolean
        oidc:
          $ref: '#/components/schemas/OidcPublicConfig'

    OidcPublicConfig:
      type: object
      required: [enabled, buttonText, autoLaunch]
      properties:
        enabled:
          type: boolean
        buttonText:
          type: string
        autoLaunch:
          type: boolean

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
            message:
              type: string

    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >
            Login identifier. Trimmed and lower-cased before comparison, so it is
            case-insensitive.
        password:
          type: string
          minLength: 8
          maxLength: 128

    RegisterCredentials:
      allOf:
        - $ref: '#/components/schemas/AuthCredentials'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 64
              description: >
                Optional display name. Defaults to the local part of the email.

    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    User:
      type: object
      required: [id, email, name, authProviders]
      description: The authenticated user. Only ever describes the caller's own account.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          description: Display name shown to other users; not unique.
        authProviders:
          type: array
          minItems: 1
          items:
            type: string
            enum: [local, oidc]
          description: >
            How this account can authenticate. local means a password hash is set;
            oidc means at least one linked identity exists.

    UserDirectoryEntry:
      type: object
      required: [id, name]
      description: >
        Share-picker directory entry from GET /api/users. Display name only:
        no email address and no authProviders.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ListItemPreview:
      type: object
      required: [id, text, checked]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        checked:
          type: boolean

    List:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
        - previewItems
        - itemCount
        - isOwner
        - ownerName
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        previewItems:
          type: array
          description: >
            First 8 items by position for homepage card previews.
            Populated on GET /api/lists and PATCH /api/lists/{id}; empty on create.
          items:
            $ref: '#/components/schemas/ListItemPreview'
        itemCount:
          type: integer
          minimum: 0
          description: >
            Total items in the list; used with previewItems for "+N more".
            Populated on GET /api/lists and PATCH /api/lists/{id}; 0 on create.
        isOwner:
          type: boolean
          description: True when the authenticated user owns the list.
        ownerName:
          type: string
          description: Display name of the list owner.

    ListMember:
      type: object
      required: [userId, name]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the member.

    PutMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid
          description: Complete desired member set (replaces previous members).

    CreateListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    UpdateListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    ListItem:
      type: object
      required: [id, listId, text, checked, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        text:
          type: string
        checked:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateItemRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    UpdateItemRequest:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        checked:
          type: boolean
        position:
          type: integer
          minimum: 0

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request body
    UnauthorizedError:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: NOT_FOUND
              message: Not found
    ConflictError:
      description: Conflict (e.g. email already registered)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: CONFLICT
              message: Email already registered
    ForbiddenError:
      description: >
        Authenticated or policy refusal (registration closed, or access without capability
        such as a member deleting a list).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: FORBIDDEN
              message: Only the list owner can perform this action
