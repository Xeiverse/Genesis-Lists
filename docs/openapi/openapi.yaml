openapi: 3.0.3
info:
  title: Genesis Lists API
  version: 1.0.0
  description: |
    REST API for Genesis Lists MVP. Session cookie authentication.
    Spec is the source of truth — see docs/04-api.md.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [Health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: "1.0.0"
                schemaVersion: 1
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthErrorResponse'
              example:
                status: error
                version: "1.0.0"

  /api/auth/registration:
    get:
      operationId: getRegistration
      summary: Whether new accounts can be created
      tags: [Auth]
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatus'
              example:
                open: true

  /api/auth/register:
    post:
      operationId: register
      summary: Register a new user and create a session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
            example:
              username: alice
              password: secretpass
      responses:
        '201':
          description: Created and logged in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (genesis_session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/login:
    post:
      operationId: login
      summary: Log in and create a session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/logout:
    post:
      operationId: logout
      summary: Destroy the current session
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/me:
    get:
      operationId: getMe
      summary: Current authenticated user
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/change-password:
    post:
      operationId: changePassword
      summary: Change the current user's password
      description: |
        Updates the password hash. Other sessions for this user are deleted;
        the session that made this request stays signed in.
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/lists:
    get:
      operationId: listLists
      summary: List lists owned by the current user
      description: Each list includes itemCount and up to 8 previewItems (by position) for homepage cards.
      tags: [Lists]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lists]
                properties:
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/List'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      operationId: createList
      summary: Create a list
      tags: [Lists]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/lists/{id}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    patch:
      operationId: updateList
      summary: Rename a list
      tags: [Lists]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteList
      summary: Delete a list and its items
      tags: [Lists]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/lists/{id}/items:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: listItems
      summary: List items in a list
      tags: [Items]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: createItem
      summary: Add an item to a list
      tags: [Items]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/lists/{id}/items/checked:
    parameters:
      - $ref: '#/components/parameters/ListId'
    delete:
      operationId: clearCheckedItems
      summary: Delete every ticked item on a list
      description: >
        Deletes items where checked is true. Unticked items are left in place.
        Idempotent: 204 when the list is owned even if nothing is ticked.
        404 if the list is missing or not owned (no existence leak).
      tags: [Items]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Ticked items deleted (or none were ticked)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    patch:
      operationId: updateItem
      summary: Update an item
      tags: [Items]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteItem
      summary: Delete an item
      tags: [Items]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: genesis_session

  parameters:
    ListId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status, version, schemaVersion]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "1.0.0"
        schemaVersion:
          type: integer
          minimum: 1
          example: 1

    HealthErrorResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [error]
        version:
          type: string

    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
            message:
              type: string

    AuthCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
        password:
          type: string
          minLength: 8
          maxLength: 128

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string

    ListItemPreview:
      type: object
      required: [id, text, checked]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        checked:
          type: boolean

    List:
      type: object
      required: [id, name, createdAt, updatedAt, previewItems, itemCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        previewItems:
          type: array
          description: >
            First 8 items by position for homepage card previews.
            Populated on GET /api/lists and PATCH /api/lists/{id}; empty on create.
          items:
            $ref: '#/components/schemas/ListItemPreview'
        itemCount:
          type: integer
          minimum: 0
          description: >
            Total items in the list; used with previewItems for "+N more".
            Populated on GET /api/lists and PATCH /api/lists/{id}; 0 on create.

    CreateListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    UpdateListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    ListItem:
      type: object
      required: [id, listId, text, checked, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        text:
          type: string
        checked:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateItemRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    UpdateItemRequest:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        checked:
          type: boolean
        position:
          type: integer
          minimum: 0

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request body
    UnauthorizedError:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: NOT_FOUND
              message: Not found
    ConflictError:
      description: Conflict (e.g. username taken)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: CONFLICT
              message: Username already taken
    ForbiddenError:
      description: Authenticated or policy refusal (for example registration closed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error:
              code: FORBIDDEN
              message: Registration is closed
